[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenclave"
version = "0.2.0"
description = "A bug-triage classifier feeding a best-of-N multi-agent code-fix harness (an honest reproduction of the 'Chairman LLM' pattern)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "David Nkpa" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
